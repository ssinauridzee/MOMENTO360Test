name: Tao Klarjeti Android APK
on:
  push:
    branches: [tao-klarjeti-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack full Android project
        run: |
          base64 --decode project.tar.xz.b64 > project.tar.xz
          tar -xJf project.tar.xz
          test -f app/build.gradle
          python3 -m json.tool app/src/main/assets/places.json > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tao-klarjeti-guide.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TaoKlarjeti-Android-APK
          path: tao-klarjeti-guide.apk
          retention-days: 30
      - name: Publish direct APK download on isolated branch
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -f tao-klarjeti-guide.apk
          git commit -m 'Publish built Tao-Klarjeti Android APK'
          git push origin HEAD:tao-klarjeti-app
