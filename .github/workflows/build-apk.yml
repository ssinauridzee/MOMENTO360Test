name: Build DiskScope APK
on:
  push:
    branches: [diskscope-android]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK 35
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          "$SDKMANAGER" --list >/dev/null
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract project
        run: mkdir -p work && tar -xJf source.tar.xz -C work
      - name: Build installable APK
        run: cd work && gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DiskScope-Android-APK
          path: work/app/build/outputs/apk/debug/*.apk
      - name: Publish direct-download APK
        run: |
          mkdir -p downloads
          cp work/app/build/outputs/apk/debug/*.apk downloads/DiskScope.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/DiskScope.apk
          git diff --cached --quiet || (git commit -m 'Publish DiskScope Android APK [skip ci]' && git push)
