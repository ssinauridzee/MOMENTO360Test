name: MOMENTO Terjoloba Festival Music Windows EXE
on:
  push:
    branches: [momento-windows-festival-music]
    paths:
      - 'windows_festival_music/**'
      - '.github/workflows/windows_festival_music.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momento-windows-festival-music
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_festival_music
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 imageio-ffmpeg==0.6.0 numpy==2.2.6
      - name: Test logic
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Generate seven original festival instrumentals
        run: |
          $ffmpeg=(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          Copy-Item -LiteralPath $ffmpeg -Destination "ffmpeg.exe" -Force
          python generate_music.py --out music --ffmpeg "ffmpeg.exe"
          if ($LASTEXITCODE -ne 0) { throw "Music generation failed" }
          $tracks=@(Get-ChildItem "music" -Filter "Terjoloba_*.mp3")
          if ($tracks.Count -ne 7) { throw "Music catalog incomplete: $($tracks.Count)" }
          foreach ($track in $tracks) {
            & $ffmpeg -hide_banner -loglevel error -i $track.FullName -f null -
            if ($LASTEXITCODE -ne 0) { throw "Bad MP3: $($track.Name)" }
          }
      - name: Test desktop UI opens on Windows
        run: |
          python app.py --ui-test
          if ($LASTEXITCODE -ne 0) { throw "GUI failed" }
      - name: Build standalone EXE with embedded music and FFmpeg
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MOMENTO_Festival_Music --add-binary "ffmpeg.exe;." --add-data "music;music" app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (!(Test-Path "dist/MOMENTO_Festival_Music.exe")) { throw "EXE missing" }
      - name: Test packaged EXE and replace original video audio
        run: |
          $ffmpeg=(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          $exe=(Resolve-Path "dist/MOMENTO_Festival_Music.exe").Path
          $ui=Start-Process -FilePath $exe -ArgumentList @("--ui-test") -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw "Packaged GUI did not open" }
          New-Item -ItemType Directory -Path "test_output" -Force | Out-Null
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30" -f lavfi -i "sine=frequency=1000:sample_rate=44100" -t 12 -c:v libx264 -pix_fmt yuv420p -c:a aac "test_output/input_with_original_audio.mp4"
          if ($LASTEXITCODE -ne 0) { throw "Test video failed" }
          $song=(Resolve-Path "music/Terjoloba_Celebration.mp3").Path
          $input=(Resolve-Path "test_output/input_with_original_audio.mp4").Path
          $out=Join-Path (Get-Location).Path "test_output/MOMENTO_with_festival_music.mp4"
          $test=Start-Process -FilePath $exe -ArgumentList @("--verify",$input,$song,$out) -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Packaged EXE audio test failed" }
          & $ffmpeg -hide_banner -loglevel error -i $out -f null -
          if ($LASTEXITCODE -ne 0) { throw "Output cannot decode" }
          $before=((& $ffmpeg -hide_banner -loglevel error -i $input -map 0:v:0 -c:v copy -f md5 -) | Out-String).Trim()
          $after=((& $ffmpeg -hide_banner -loglevel error -i $out -map 0:v:0 -c:v copy -f md5 -) | Out-String).Trim()
          if ($before -ne $after) { throw "Video bitstream changed after music replacement" }
          Write-Host "Original video preserved; audio replaced; GUI passed"
      - uses: actions/upload-artifact@v4
        with:
          name: MOMENTO-Festival-Music-Windows-EXE
          path: windows_festival_music/dist/MOMENTO_Festival_Music.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="momento-festival-music-v1.0"
          $file="dist/MOMENTO_Festival_Music.exe"
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
          "$hash  MOMENTO_Festival_Music.exe" | Set-Content "dist/MOMENTO_Festival_Music.exe.sha256" -Encoding ascii
          Copy-Item "music/MOMENTO_MUSIC_LICENSE.txt" -Destination "dist/MOMENTO_MUSIC_LICENSE.txt"
          $assets=@($file,"dist/MOMENTO_Festival_Music.exe.sha256","dist/MOMENTO_MUSIC_LICENSE.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MOMENTO Festival Music v1.0 - Terjoloba" --notes "Offline Windows 10/11 portable EXE with 7 original festive instrumentals. Import edited GoPro MP4s, strip original audio, randomly replace music, export batch videos. Preserves original video bitstream. No subscription." --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
