name: MOMENTO 360 HERO9 Download Fix v1.1 APK
on:
  push:
    branches: [momento360-gopro-download-fix]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MOMENTO360-GoPro-Download-Fix-v1.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
