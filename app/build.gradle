
plugins {
    id 'com.android.application'
}

android {
    namespace 'ge.momento.test360'
    compileSdk 35

    defaultConfig {
        applicationId 'ge.momento.test360'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
